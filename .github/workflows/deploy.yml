# ============================================================================
# BlackBook L1 — CI/CD: Build on GitHub Actions → Deploy pre-built to Hetzner
# ============================================================================
#
# HOW IT WORKS (hot upgrade — no Rust compile on Hetzner):
#   [build job]  GitHub Actions runner (ubuntu-latest, 2-core) compiles Rust
#                and builds a Docker image with layer caching via GitHub Cache.
#                Pushes image to GitHub Container Registry (GHCR).
#   [deploy job] SSH to Hetzner: pulls the pre-built image (~30 s), tags it
#                as the local compose image, restarts the container, polls /live.
#
# DEPLOY TIMES:
#   First push   — ~15 min  (cold compile, no cache)
#   Subsequent   — ~3-5 min (incremental, Docker layer cache restored from GHA)
#   Hetzner step — ~30-60 s (just docker pull + restart, no compile)
#
# REQUIRED GITHUB SECRETS  (Settings → Secrets and variables → Actions):
#   HETZNER_HOST      — VPS hostname or IP, e.g. layer1.blackbook.id
#   HETZNER_USER      — SSH user, e.g. root
#   HETZNER_SSH_KEY   — Full private SSH key (including -----BEGIN/END----- lines)
#
# GHCR auth uses the automatic GITHUB_TOKEN — no extra secrets needed.
# The image is private by default (same visibility as the repo).
# To make it public: https://github.com/orgs/aMarketology/packages → Change visibility
# ============================================================================

name: CI/CD → Hetzner

on:
  push:
    branches: [master]
  workflow_dispatch:   # allow manual trigger from the Actions tab

env:
  IMAGE: ghcr.io/amarketology/l1-blackbook

jobs:
  # ── Job 1: Build Docker image on GitHub's runner ──────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to GHCR using GITHUB_TOKEN

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (with GitHub Actions layer cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tag with both :latest and the commit SHA for rollback ability
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # GitHub Actions cache: restores layers from previous runs.
          # mode=max caches all intermediate layers, not just the final stage.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: Pull pre-built image on Hetzner and restart ────────────────────
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: build          # only run after image is pushed
    timeout-minutes: 10
    permissions:
      packages: read      # read GHCR using GITHUB_TOKEN

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Pass GITHUB_TOKEN + actor into the SSH session so Hetzner can
          # authenticate to GHCR (the token is valid for the duration of this job).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          IMAGE_REF: ${{ env.IMAGE }}:${{ github.sha }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GH_TOKEN,GH_ACTOR,IMAGE_REF
          command_timeout: 8m
          script: |
            set -euo pipefail
            APP_DIR="/opt/blackbook"

            echo ""
            echo "╔══════════════════════════════════════════╗"
            echo "║   BlackBook L1 — Hot Upgrade Deploy      ║"
            echo "╚══════════════════════════════════════════╝"
            echo ""
            echo "Image: $IMAGE_REF"
            echo ""

            # ── 1. Pull the pre-built image from GHCR ─────
            echo "[1/4] Authenticating to GHCR..."
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

            echo "[2/4] Pulling pre-built image (no Rust compile needed)..."
            docker pull "$IMAGE_REF"

            # Tag it as the name docker-compose.prod.yml expects after a local build.
            # Docker Compose names the image "<project>-<service>" where project
            # comes from the directory name of the compose file → "deployment-blackbook".
            docker tag "$IMAGE_REF" deployment-blackbook:latest

            # ── 2. Sync latest compose / config files ─────
            echo "[3/4] Syncing repo config files..."
            cd "$APP_DIR"
            git fetch origin master
            git reset --hard origin/master
            echo "Config at commit: $(git log -1 --oneline)"

            # ── 3. Restart the container (no --build) ─────
            # docker compose will use the existing deployment-blackbook:latest image
            # that we just tagged — it will NOT recompile anything.
            docker compose -f deployment/docker-compose.prod.yml up -d

            # ── 4. Health check ───────────────────────────
            echo "[4/4] Waiting for node to become healthy..."
            ELAPSED=0
            until curl -sf http://localhost:8080/live >/dev/null 2>&1; do
              sleep 5; ELAPSED=$((ELAPSED + 5))
              if [ "$ELAPSED" -ge 120 ]; then
                echo "❌ Node did not become healthy after 120s"
                docker logs --tail 50 blackbook-l1 || true
                exit 1
              fi
              echo "  ... waiting (${ELAPSED}s)"
            done

            echo ""
            echo "✅ Hot upgrade complete!"
            echo "── PoH Status ──────────────────────────────"
            curl -s http://localhost:8080/poh/status | python3 -m json.tool 2>/dev/null \
              || curl -s http://localhost:8080/poh/status
            echo ""
