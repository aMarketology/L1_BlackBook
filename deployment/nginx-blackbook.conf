server {
    listen 80;
    server_name layer1.blackbook.id;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name layer1.blackbook.id;

    ssl_certificate     /etc/letsencrypt/live/layer1.blackbook.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/layer1.blackbook.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Allow larger request bodies (escrow deposits, merkle proofs)
    client_max_body_size 1m;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Forward all HTTP methods (GET, POST, PUT, DELETE, OPTIONS, etc.)
        proxy_method               $request_method;
        proxy_pass_request_headers on;
        proxy_pass_request_body    on;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (balance-push subscription)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

server {
    listen 80;
    server_name layer2.blackbook.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name layer2.blackbook.id;

    ssl_certificate     /etc/letsencrypt/live/layer1.blackbook.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/layer1.blackbook.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1m;

    # ── TS L2 Sequencer — batch sealing / Merkle proofs (oracle/admin) ──────
    # Strips /seq/ prefix: /seq/health → :7072/health, /seq/proof/:addr → :7072/proof/:addr
    location /seq/ {
        proxy_pass         http://127.0.0.1:7072/;
        proxy_http_version 1.1;
        proxy_pass_request_headers on;
        proxy_pass_request_body    on;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── L2 BlackBook prediction market (Rust dealer / LMSR engine) ──────────
    # All remaining traffic → blackbook-l2 container on port 1234.
    location / {
        proxy_pass         http://127.0.0.1:1234;
        proxy_http_version 1.1;
        proxy_pass_request_headers on;
        proxy_pass_request_body    on;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (L2 balance subscriptions)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
