# ============================================================================
# BlackBook — Production Docker Compose (Cherry Servers) — v1.0.2
# ============================================================================
# Usage:
#   docker compose -f deployment/docker-compose.prod.yml up -d --build
#   docker compose -f deployment/docker-compose.prod.yml logs -f blackbook-l1
#   docker compose -f deployment/docker-compose.prod.yml logs -f l2-sequencer
#   docker compose -f deployment/docker-compose.prod.yml down
#
# Requires: /opt/blackbook/.env (copy from .env.template and fill in values)
#   Set BLACKBOOK_MODE=validator and BLACKBOOK_IDENTITY=cherry-writer in .env
# ============================================================================

services:
  blackbook:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: blackbook-l1
    restart: unless-stopped

    # Load all secrets from .env — never hardcode secrets here
    env_file:
      - ../.env

    # Additional non-secret runtime config (can be overridden by .env)
    environment:
      - RUST_LOG=${RUST_LOG:-info,layer1=info,tower_http=warn}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-1}
      - REDB_PATH=${REDB_PATH:-/data/blockchain_data/blockchain.redb}

    # Run in validator mode by default (override via BLACKBOOK_MODE in .env)
    command: >
      /app/layer1
      --mode ${BLACKBOOK_MODE:-validator}
      --identity ${BLACKBOOK_IDENTITY:-cherry-writer}
      --http-port ${BLACKBOOK_HTTP_PORT:-8080}
      --grpc-port ${BLACKBOOK_GRPC_PORT:-50051}

    ports:
      - "8080:8080"    # HTTP API (wallet, escrow, admin)
      - "8899:8899"    # Solana JSON-RPC (Phantom, OneKey, agents)
      - "8003:8003/udp" # UDP TPU (binary transaction ingestion)
      - "8004:8004/udp" # Turbine tick shred broadcast (PoH real-time → Reader nodes)
      - "50051:50051"  # gRPC relay (writer → reader nodes)
      - "50052:50052"  # gRPC settlement (L2 → L1 SubscribeBalances / SubmitMerkleRoot)

    volumes:
      - blackbook-data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 1G

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "7"

    networks:
      - blackbook-net

  # ── L2 Sequencer ──────────────────────────────────────────────────────────
  l2-sequencer:
    build:
      context: ../sequencer
      dockerfile: Dockerfile
    container_name: l2-sequencer
    restart: unless-stopped

    env_file:
      - ../.env

    environment:
      # Internal Docker network — bypasses public internet entirely
      - L1_HTTP_URL=http://blackbook-l1:8080
      - L1_WS_URL=ws://blackbook-l1:8080/ws
      - PORT=7072
      - DB_PATH=/app/data/l2.sqlite
      - SLOTS_PER_BATCH=${SLOTS_PER_BATCH:-25}
      # L2_SEQUENCER_PRIVKEY and L2_SEQUENCER_PUBKEY come from .env

    ports:
      - "7072:7072"    # L2 HTTP API (proxied via Nginx as /l2/)

    volumes:
      # Named volume — survives container rebuilds; never wipe in production
      - l2-data:/app/data

    depends_on:
      blackbook:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7072/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    networks:
      - blackbook-net

networks:
  blackbook-net:
    driver: bridge

volumes:
  blackbook-data:
    driver: local
    # Data persists across container restarts and rebuilds.
    # To wipe chain: docker volume rm deployment_blackbook-data
    # Do NOT do this in production — it destroys all wallet shards and blocks.

  l2-data:
    driver: local
    # L2 SQLite state: Merkle roots, bets, contest records.
    # To wipe L2: docker volume rm deployment_l2-data
    # Do NOT do this in production — it will invalidate all pending Merkle proofs.
