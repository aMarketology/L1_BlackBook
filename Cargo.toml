[package]
name = "layer1"
version = "5.0.0"
edition = "2021"
default-run = "layer1"

[features]
# Enable this feature for development admin endpoints (mint/burn)
# cargo run --features unsafe_admin
unsafe_admin = []

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["rt-multi-thread", "signal", "macros", "net", "time", "sync"] }

# Web framework
axum = { version = "0.7", features = ["macros", "ws"] }
tower = { version = "0.4", features = ["util", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-gzip"] }

# Structured logging (production-grade observability)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
borsh = { version = "1.3", features = ["derive"] }
thiserror = "1.0"

# Reed-Solomon erasure coding for Turbine FEC shreds
# GF(2^8) polynomial arithmetic — allows recovery of any k missing shreds
# from k coding shreds. 32 data + 32 coding = tolerates 32 simultaneous drops.
reed-solomon-erasure = { version = "6.0", features = ["simd-accel"] }

# Cryptography — Ed25519 + SHA-256 PoH chain
sha2 = "0.10"
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
curve25519-dalek = { version = "4.1", features = ["group"] }
getrandom = "0.2"
once_cell = "1.19"

# ═══════════════════════════════════════════════════════════════
# FUTURE: FROST TSS (Hot Upgrade Phase 2)
# ═══════════════════════════════════════════════════════════════
# FROST Institutional Wallets will be added via hot upgrade after mainnet launch
# See docs/HOT_UPGRADE_GUIDE.md for implementation roadmap

# BLAKE3 for fast hashing (wallet addresses, verification)
blake3 = "1.5"

# Rand compatibility for FROST (uses rand_core 0.6)
rand_core = "0.6"

# BIP-39 for hardware wallet compatible key derivation (export_keypair example)
bip39 = "2.0"

# Async trait support
async-trait = "0.1"

# Parallel processing - Sealevel-style execution
rayon = "1.10"
crossbeam = "0.8"
dashmap = "6.0"
parking_lot = "0.12"
num_cpus = "1.16"

# Networking (QUIC for speed) - Optional for now, enable later
# quinn = "0.11"

# Utilities
rand = "0.8.5"
uuid = { version = "1.0", features = ["serde", "v4"] }
hex = "0.4"
lru = "0.12"
chrono = { version = "0.4.41", features = ["serde"] }

# HTTP client — custody wallet watcher (Solana RPC polling)
reqwest = { version = "0.12", features = ["json"] }
dotenv = "0.15"

# WebSocket client — event-driven custody watcher (replaces 30-second polling)
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# HMAC-SHA256 — Alchemy webhook signature verification
hmac = "0.12"
base64 = "0.21"
fastrand = "2.0"
lazy_static = "1.4"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Channels for Gulf Stream transaction forwarding
flume = "0.11"

# memmap2 removed — not used until >10M accounts (Cloudbreak phase)
# atomic removed — std::sync::atomic covers all use cases

# ═══════════════════════════════════════════════════════════════
# PRODUCTION STORAGE LAYER (ReDB + Merkle Trie)
# ═══════════════════════════════════════════════════════════════
# ReDB - Pure Rust embedded key-value store with MVCC
# ACID transactions, single-writer/multi-reader, zero-copy reads
redb = "2.4"

# Merkle Tree for state roots and light client proofs
rs_merkle = "1.4"

# NOTE: Using Borsh (already in deps) for serialization - Solana-compatible
# bincode removed - Borsh is deterministic (required for Merkle proofs)

# ═══════════════════════════════════════════════════════════════
# SVM: Solana Virtual Machine execution layer
# Pin exact versions — Solana sub-crates have tight internal coupling.
# ═══════════════════════════════════════════════════════════════
solana-sdk            = "2.1"
solana-program        = "2.1"
solana-program-runtime = "2.1"
solana-system-program = "2.1"
solana_rbpf           = "0.8"

# ═══════════════════════════════════════════════════════════════
# Solana JSON-RPC 2.0 server (port 8899)
# Allows any Solana wallet (OneKey, Phantom) to connect directly.
# ═══════════════════════════════════════════════════════════════
jsonrpsee = { version = "0.24", features = ["server", "macros"] }
bs58      = "0.5"

# Solana serializes VersionedTransaction with bincode — needed for sendTransaction
bincode   = "1.3"

# Windows build fix: solana-secp256r1-program (transitive via solana-sdk)
# requires OpenSSL. Force "vendored" so it compiles from source rather than
# requiring a system OpenSSL installation. One-time compile cost, then cached.
openssl               = { version = "0.10", features = ["vendored"] }

# libp2p removed — zero code references it. gRPC relay is the production transport.
# Re-add when P2P gossip is needed (Phase 17+).

# Unix domain sockets for high-speed internal IPC
# (gRPC over UDS for validator-to-validator communication)
prost = "0.13"
tonic = { version = "0.12", features = ["transport"] }
tonic-build = "0.12"
async-stream = "0.3"
tokio-stream = "0.1"
futures = "0.3.32"

[dev-dependencies]
# Testing utilities
tokio-test = "0.4"
tempfile = "3.10"
litesvm = "0.9.1"
# HTTP client for load testing and integration examples
reqwest = { version = "0.12", features = ["json"] }

[build-dependencies]
# Protocol Buffer compilation
tonic-build = "0.12"

[lib]
name = "layer1"
path = "src/lib.rs"

[[bin]]
name = "layer1"
path = "src/main.rs"

# ═══════════════════════════════════════════════════════════════
# PROFILE CONFIGURATION - Fix Windows linker crashes
# ═══════════════════════════════════════════════════════════════
# Debug builds on Windows crash link.exe due to excessive debug symbols.
# Solution: Disable debug info entirely for dev builds.

[profile.dev]
# CRITICAL: Set to 0 to completely disable debug symbols (fixes Windows link.exe crash)
debug = 0
# Enable optimizations even in debug (faster builds, smaller binaries)
opt-level = 1
# DISABLE incremental compilation to avoid linker errors
incremental = false
# Use more codegen units to avoid symbol conflicts
codegen-units = 256

[profile.dev.package."*"]
# Optimize all dependencies in debug mode
opt-level = 2
debug = 0

[profile.release]
# Full optimizations for production
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
