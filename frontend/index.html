<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackBook L1 Telemetry</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap');
  :root {
    --bg: #050505;
    --panel: #0d0d12;
    --border: #1f1f2e;
    --text: #e0e0e0;
    --neon-blue: #00f3ff;
    --neon-green: #00ff66;
    --neon-red: #ff003c;
    --neon-yellow: #ffd700;
  }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    margin: 0; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { 
    font-family: 'Orbitron', sans-serif; 
    color: var(--neon-blue); 
    text-shadow: 0 0 10px rgba(0,243,255,0.5); 
    text-transform: uppercase; 
    letter-spacing: 3px;
  }
  .dashboard {
    display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; 
    max-width: 1200px; width: 100%; margin-top: 20px;
  }
  .gauge {
    background: var(--panel); border: 2px solid var(--border); border-radius: 12px;
    padding: 20px 30px; text-align: center;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.5);
    flex: 1 1 200px; min-width: 200px;
  }
  .gauge.wide { width: 100%; max-width: 900px; flex: 1 1 100%; }
  .gauge-title { 
    color: #8892b0; font-size: 14px; text-transform: uppercase; 
    letter-spacing: 2px; margin-bottom: 12px; 
  }
  .gauge-value {
    font-family: 'Orbitron', sans-serif; font-size: 48px; font-weight: 700;
    color: var(--neon-green); text-shadow: 0 0 15px rgba(0,255,102,0.4);
  }
  .gauge-value.blue { color: var(--neon-blue); text-shadow: 0 0 15px rgba(0,243,255,0.4); }
  .gauge-value.yellow { color: var(--neon-yellow); text-shadow: 0 0 15px rgba(255,215,0,0.4); }
  
  .table-container { height: 350px; overflow-y: auto; text-align: left; width: 100%; margin-top: 15px;}
  table { width: 100%; border-collapse: collapse; }
  th { 
    position: sticky; top: 0; background: var(--panel); padding: 12px; 
    color: var(--neon-blue); border-bottom: 2px solid var(--border); 
    text-transform: uppercase; font-size: 12px; letter-spacing: 1px;
  }
  td { padding: 10px 12px; border-bottom: 1px solid #1a1a24; font-size: 15px; color: #a0aec0;}
  tr:hover td { background: #13131c; }
  .tx-hash { color: var(--neon-green); }
  .tx-amt { color: var(--neon-yellow); font-weight: bold; }
  
  /* Scrollbar override */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #000; }
  ::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #333; }
</style>
</head>
<body>
  <h1>BlackBook L1 Telemetry</h1>
  <div class="dashboard">
    <div class="gauge">
      <div class="gauge-title">Network TPS</div>
      <div class="gauge-value" id="tps-value">0</div>
    </div>
    <div class="gauge">
      <div class="gauge-title">Current Slot</div>
      <div class="gauge-value blue" id="slot-value">---</div>
    </div>
    <div class="gauge">
      <div class="gauge-title">PoH Hashes / Sec</div>
      <div class="gauge-value blue" id="hps-value">---</div>
    </div>
    <div class="gauge">
      <div class="gauge-title">Total Accounts</div>
      <div class="gauge-value yellow" id="accounts-value">---</div>
    </div>
    
    <div class="gauge wide">
      <div class="gauge-title">Live Transaction Feed</div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Time</th><th>Type</th><th>From</th><th>To</th><th>Amount (BB)</th><th>Status</th>
            </tr>
          </thead>
          <tbody id="tx-feed">
            <!-- Data populated dynamically -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
        ? 'http://localhost:8080' : window.location.origin;

    let lastExec = 0;
    
    function shortAddr(a) { return a ? a.slice(0,6) + '...' + a.slice(-4) : '-'; }
    
    async function fetchMetrics() {
      try {
        const [health, poh, stats, txData] = await Promise.all([
          fetch(API + '/health').then(r=>r.json()).catch(()=>({})),
          fetch(API + '/poh/status').then(r=>r.json()).catch(()=>({})),
          fetch(API + '/stats').then(r=>r.json()).catch(()=>({})),
          fetch(API + '/address/all/transactions?page=1&limit=15').then(r=>r.json()).catch(()=>({transactions:[]}))
        ]);
        
        if (poh.current_slot) {
          document.getElementById('slot-value').innerText = Number(poh.current_slot).toLocaleString();
          document.getElementById('hps-value').innerText = Number(poh.hashes_per_second || 0).toLocaleString();
        }
        if (health.blockchain) {
          document.getElementById('accounts-value').innerText = Number(health.blockchain.account_count || 0).toLocaleString();
        }

        // Infer TPS based on packets executed difference over 1 second
        let activeTps = 0;
        let currentExec = stats.pipeline?.packets_executed || 0;
        if (lastExec > 0) {
           activeTps = Math.max(0, currentExec - lastExec);
        }
        lastExec = currentExec;
        
        // Simple animation/decay if needed, but direct assignment works for realistic dashboard
        document.getElementById('tps-value').innerText = activeTps;

        // Render feed
        const tbody = document.getElementById('tx-feed');
        if (txData && txData.transactions) {
          tbody.innerHTML = '';
          for (let tx of txData.transactions) {
            const tr = document.createElement('tr');
            const d = new Date(tx.timestamp * 1000);
            const timeStr = d.getHours().toString().padStart(2,'0') + ':' + 
                            d.getMinutes().toString().padStart(2,'0') + ':' + 
                            d.getSeconds().toString().padStart(2,'0');
            tr.innerHTML = \`
              <td>\${timeStr}</td>
              <td style="color:var(--neon-blue);">\${tx.tx_type || 'Transfer'}</td>
              <td class="tx-hash">\${shortAddr(tx.from_address)}</td>
              <td class="tx-hash">\${shortAddr(tx.to_address)}</td>
              <td class="tx-amt">\${(tx.amount || 0).toFixed(6)}</td>
              <td>\${tx.status || 'finalized'}</td>
            \`;
            tbody.appendChild(tr);
          }
        }
      } catch(e) {
        console.error('Fetch error', e);
      }
    }

    // Refresh aggressively for a dashboard feel
    setInterval(fetchMetrics, 1000);
    fetchMetrics();
  </script>
</body>
</html>
